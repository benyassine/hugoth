{{ $name := .Get "name" }}
{{ $title := .Get "title" }}
{{ $image := .Get "image" }}
{{ $content := .Inner }}

<div class="testimonial">
    <div class="testimonial-content">
        <div class="quote-mark">"</div>
        <p class="testimonial-text">{{ $content | markdownify }}</p>
    </div>
    
    <div class="testimonial-author">
        {{ if $image }}
        <div class="author-image">
            <img src="{{ $image }}" alt="{{ $name }}" loading="lazy">
        </div>
        {{ end }}
        
        <div class="author-info">
            <h4 class="author-name">{{ $name }}</h4>
            {{ if $title }}
            <p class="author-title">{{ $title }}</p>
            {{ end }}
        </div>
    </div>
</div>

<style>
.testimonial {
    background: var(--background-light);
    border-radius: 10px;
    padding: 2rem;
    margin: 1.5rem 0;
    box-shadow: var(--shadow);
    position: relative;
    border-right: 4px solid var(--primary-color);
}

.testimonial-content {
    margin-bottom: 1.5rem;
}

.quote-mark {
    font-size: 4rem;
    color: var(--primary-light);
    line-height: 1;
    margin-bottom: 0.5rem;
    font-family: serif;
}

.testimonial-text {
    font-size: 1.1rem;
    line-height: 1.8;
    color: var(--text-color);
    font-style: italic;
    margin: 0;
}

.testimonial-author {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.author-image {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
}

.author-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.author-info {
    flex: 1;
}

.author-name {
    margin: 0 0 0.25rem 0;
    color: var(--primary-color);
    font-size: 1.1rem;
}

.author-title {
    margin: 0;
    color: var(--text-light);
    font-size: 0.9rem;
}

@media (max-width: 768px) {
    .testimonial {
        padding: 1.5rem;
    }
    
    .testimonial-author {
        flex-direction: column;
        text-align: center;
        gap: 0.5rem;
    }
    
    .author-image {
        width: 50px;
        height: 50px;
    }
}
</style>

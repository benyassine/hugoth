{{ $src := .Get "src" }}
{{ $title := .Get "title" | default "ملف صوتي" }}
{{ $autoplay := .Get "autoplay" | default "false" }}
{{ $controls := .Get "controls" | default "true" }}
{{ $loop := .Get "loop" | default "false" }}
{{ $muted := .Get "muted" | default "false" }}

<div class="audio-container">
    <audio 
        controls="{{ $controls }}"
        {{ if eq $autoplay "true" }}autoplay{{ end }}
        {{ if eq $loop "true" }}loop{{ end }}
        {{ if eq $muted "true" }}muted{{ end }}
        style="width: 100%;"
        title="{{ $title }}">
        <source src="{{ $src }}" type="audio/mpeg">
        متصفحك لا يدعم تشغيل الملف الصوتي.
    </audio>
</div>

<style>
.audio-container {
    margin: 1.5rem 0;
    padding: 1rem;
    background: var(--background-light);
    border-radius: 10px;
    box-shadow: var(--shadow);
    border-right: 4px solid var(--primary-color);
}

.audio-container audio {
    outline: none;
}

.audio-container audio::-webkit-media-controls-panel {
    background-color: var(--background-light);
}

@media (max-width: 768px) {
    .audio-container {
        margin: 1rem 0;
        padding: 0.75rem;
    }
}
</style>

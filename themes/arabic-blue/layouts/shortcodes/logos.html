{{ $content := .Inner }}

<div class="logos-container">
    {{ $content | markdownify }}
</div>

<style>
.logos-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 2rem;
    margin: 2rem 0;
    padding: 2rem;
    background: var(--background-light);
    border-radius: 10px;
    box-shadow: var(--shadow);
}

.logo-item {
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.7;
    transition: opacity 0.3s ease, transform 0.3s ease;
    filter: grayscale(100%);
}

.logo-item:hover {
    opacity: 1;
    transform: scale(1.1);
    filter: grayscale(0%);
}

.logo-item img {
    max-height: 60px;
    max-width: 120px;
    object-fit: contain;
}

@media (max-width: 768px) {
    .logos-container {
        gap: 1rem;
        padding: 1rem;
    }
    
    .logo-item img {
        max-height: 40px;
        max-width: 100px;
    }
}
</style>

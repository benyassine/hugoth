{{ $title := .Get "title" | default "القائمة" }}
{{ $content := .Inner }}

<div class="dropdown-menu">
    <button class="dropdown-menu-toggle" onclick="toggleDropdownMenu(this)">
        {{ $title }}
        <span class="dropdown-menu-arrow">▼</span>
    </button>
    <div class="dropdown-menu-content">
        {{ $content | markdownify }}
    </div>
</div>

<style>
.dropdown-menu {
    position: relative;
    display: inline-block;
    margin: 1rem 0;
}

.dropdown-menu-toggle {
    background-color: var(--primary-color);
    color: white;
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    transition: background-color 0.3s ease;
    min-width: 150px;
}

.dropdown-menu-toggle:hover {
    background-color: var(--primary-dark);
}

.dropdown-menu-arrow {
    transition: transform 0.3s ease;
    font-size: 0.8rem;
}

.dropdown-menu-toggle.active .dropdown-menu-arrow {
    transform: rotate(180deg);
}

.dropdown-menu-content {
    position: absolute;
    top: 100%;
    right: 0;
    background-color: white;
    min-width: 200px;
    box-shadow: var(--shadow);
    border-radius: 5px;
    z-index: 1000;
    display: none;
    border: 1px solid var(--border-color);
    overflow: hidden;
}

.dropdown-menu-content.show {
    display: block;
    animation: slideDown 0.3s ease;
}

.dropdown-menu-content ul {
    list-style: none;
    margin: 0;
    padding: 0;
}

.dropdown-menu-content li {
    border-bottom: 1px solid var(--border-color);
}

.dropdown-menu-content li:last-child {
    border-bottom: none;
}

.dropdown-menu-content a {
    display: block;
    padding: 1rem 1.5rem;
    color: var(--text-color);
    text-decoration: none;
    transition: background-color 0.3s ease;
}

.dropdown-menu-content a:hover {
    background-color: var(--background-color);
    color: var(--primary-color);
}

@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 768px) {
    .dropdown-menu-content {
        right: auto;
        left: 0;
        min-width: 150px;
    }
    
    .dropdown-menu-toggle {
        min-width: 120px;
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
    }
}
</style>

<script>
function toggleDropdownMenu(button) {
    const content = button.nextElementSibling;
    const isActive = button.classList.contains('active');
    
    // Close all other dropdown menus
    document.querySelectorAll('.dropdown-menu-toggle').forEach(btn => {
        btn.classList.remove('active');
        btn.nextElementSibling.classList.remove('show');
    });
    
    if (!isActive) {
        button.classList.add('active');
        content.classList.add('show');
    }
}

// Close dropdown when clicking outside
document.addEventListener('click', function(event) {
    if (!event.target.closest('.dropdown-menu')) {
        document.querySelectorAll('.dropdown-menu-toggle').forEach(btn => {
            btn.classList.remove('active');
            btn.nextElementSibling.classList.remove('show');
        });
    }
});
</script>

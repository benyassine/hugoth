{{ $src := .Get "src" }}
{{ $alt := .Get "alt" | default "شعار" }}
{{ $url := .Get "url" }}

<div class="logo-item">
    {{ if $url }}
    <a href="{{ $url }}" target="_blank" rel="noopener">
        <img src="{{ $src }}" alt="{{ $alt }}" loading="lazy">
    </a>
    {{ else }}
    <img src="{{ $src }}" alt="{{ $alt }}" loading="lazy">
    {{ end }}
</div>

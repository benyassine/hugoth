<header class="site-header">
    <div class="container">
        <div class="header-content">
            <a href="{{ "/" | relURL }}" class="site-title">{{ .Site.Title }}</a>
            
            <button class="menu-toggle" aria-label="فتح القائمة" onclick="toggleMenu()">
                ☰
            </button>
            
            <nav class="main-nav" id="main-nav">
                <ul>
                    {{ range .Site.Menus.main }}
                        <li>
                            <a href="{{ .URL | relURL }}" 
                               {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>
                                {{ .Name }}
                            </a>
                        </li>
                    {{ end }}
                </ul>
            </nav>
        </div>
    </div>
</header>
